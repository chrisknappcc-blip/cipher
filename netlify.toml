[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "18"

[functions]
node_bundler = "esbuild"
included_files = ["netlify/functions/utils/**"]

[functions."contact-intel"]
timeout = 26

[functions."hubspot-gap-search"]
timeout = 60

[functions."debriefs"]
timeout = 26

# The 15 minute check. Declared here as well as inside gong-poll.js: the first version relied only on the
# in-file setting, and Netlify's scheduler was not seen calling it.
[functions."gong-poll"]
schedule = "*/15 * * * *"

[[redirects]]
from = "/api/hubspot-gap-search"
to = "/.netlify/functions/hubspot-gap-search"
status = 200

[[redirects]]
from = "/api/hubspot/*"
to = "/.netlify/functions/hubspot/:splat"
status = 200

[[redirects]]
from = "/api/outlook/*"
to = "/.netlify/functions/outlook/:splat"
status = 200

[[redirects]]
from = "/api/contact-intel"
to = "/.netlify/functions/contact-intel"
status = 200

[[redirects]]
from = "/api/enrich/*"
to = "/.netlify/functions/enrich/:splat"
status = 200

[[redirects]]
from = "/api/ai/*"
to = "/.netlify/functions/ai/:splat"
status = 200

[[redirects]]
from = "/api/debriefs/*"
to = "/.netlify/functions/debriefs/:splat"
status = 200

[[headers]]
for = "/.netlify/functions/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Headers = "Authorization, Content-Type"
Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED ENVIRONMENT VARIABLES
# Set all of these in Netlify → Site settings → Environment variables
# ─────────────────────────────────────────────────────────────────────────────
#
# Clerk
# CLERK_SECRET_KEY From Clerk dashboard → API Keys
# VITE_CLERK_PUBLISHABLE_KEY From Clerk dashboard → API Keys (frontend)
#
# HubSpot
# HUBSPOT_CLIENT_ID From HubSpot → Settings → App → OAuth
# HUBSPOT_CLIENT_SECRET From HubSpot → Settings → App → OAuth
# HUBSPOT_REDIRECT_URI https://yourapp.netlify.app/api/hubspot/auth/callback
#
# Azure Storage (same account as Market Mapper)
# AZURE_STORAGE_ACCOUNT_NAME carepathiqdata
# AZURE_STORAGE_SAS_TOKEN Your SAS token (?sv=...)
# Make sure the SAS token has write access to
# the "crm-tokens" container (create it in Azure portal)
#
# App
# APP_URL https://yourapp.netlify.app
# ZOOMINFO_API_KEY From ZoomInfo developer portal (add later)
#
# Gong call debriefs
# GONG_ACCESS_KEY          Gong > Company Settings > Ecosystem > API (you must be a technical admin)
# GONG_ACCESS_KEY_SECRET   Shown ONCE when the key is created; Gong cannot show it again. (A key created
#                          by hand has no scopes to pick. It can read the workspace's calls.)
# GONG_BASE_URL            Shown on the same Gong API page, e.g. https://company-17.api.gong.io
# DEBRIEF_INTERNAL_SECRET  Any long random string. Protects the background analysis job.
# DEBRIEF_VIEW_ALL_EMAILS  Comma separated. Who sees every rep's debriefs (default: jhansel@carecontinuity.com)
# DEBRIEF_MODEL            Optional. Defaults to claude-sonnet-5-5
# GONG_BACKFILL_DAYS       Optional. How far back the very first poll looks (default 2)
# (ANTHROPIC_API_KEY and the Azure storage settings above are reused as they are.)
